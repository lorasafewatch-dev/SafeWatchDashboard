<h2>Reset your SafeWatch password</h2>
<p>You requested a new password for your SafeWatch account.</p>
<p><a href="{{ .RedirectTo }}#token_hash={{ .TokenHash }}&amp;type=recovery">Reset password</a></p>
<p>You can also open SafeWatch, choose <strong>Enter reset code</strong>, and use this code:</p>
<p style="font-size:24px;font-weight:bold;letter-spacing:4px">{{ .Token }}</p>
<p>Use the newest email. If you did not request a reset, ignore this email.</p>
